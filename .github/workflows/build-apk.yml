name: Gerar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "platforms;android-33" \
            "build-tools;35.0.0"

      - name: Preparar Gradle
        run: |
          echo "=== Procurando projeto ==="

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper encontrado na raiz."
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "GRADLE_DIR=." >> "$GITHUB_ENV"

          elif find . -maxdepth 3 -name "gradlew" -type f | head -1 | grep -q .; then
            WRAPPER=$(find . -maxdepth 3 -name "gradlew" -type f | head -1)
            DIR=$(dirname "$WRAPPER")

            echo "Gradle Wrapper encontrado em: $DIR"

            chmod +x "$WRAPPER"

            echo "GRADLE_CMD=$WRAPPER" >> "$GITHUB_ENV"
            echo "GRADLE_DIR=$DIR" >> "$GITHUB_ENV"

          else
            echo "Gradle Wrapper não encontrado."
            echo "Será utilizado Gradle 8.7."

            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "GRADLE_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Instalar Gradle 8.7
        if: env.GRADLE_CMD == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar estrutura do projeto
        run: |
          echo "================================"
          echo "ESTRUTURA DO PROJETO"
          echo "================================"

          pwd
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
            -o -name "AndroidManifest.xml" \) \
            -print

          echo ""
          echo "================================"
          echo "GRADLE"
          echo "================================"

          cd "$GRADLE_DIR"
          "$GITHUB_WORKSPACE/$GRADLE_CMD" --version || "$GRADLE_CMD" --version

      - name: Encontrar tarefa de APK
        run: |
          cd "$GRADLE_DIR"

          echo "================================"
          echo "TAREFAS DISPONÍVEIS"
          echo "================================"

          if [ "$GRADLE_CMD" = "gradle" ]; then
            gradle tasks --all
          else
            "$GITHUB_WORKSPACE/$GRADLE_CMD" tasks --all
          fi

      - name: Gerar APK Debug
        run: |
          cd "$GRADLE_DIR"

          echo "================================"
          echo "GERANDO APK"
          echo "================================"

          if [ "$GRADLE_CMD" = "gradle" ]; then

            TASK=$(gradle tasks --all 2>/dev/null | \
              grep -E "assembleDebug$" | \
              head -1 | \
              tr -d ' ')

            if [ -n "$TASK" ]; then
              echo "Tarefa encontrada: $TASK"
              gradle "$TASK" --stacktrace --no-daemon
            else
              echo "assembleDebug não encontrada."
              echo "Tentando assemble..."
              gradle assemble --stacktrace --no-daemon
            fi

          else

            TASK=$("$GITHUB_WORKSPACE/$GRADLE_CMD" tasks --all 2>/dev/null | \
              grep -E "assembleDebug$" | \
              head -1 | \
              tr -d ' ')

            if [ -n "$TASK" ]; then
              echo "Tarefa encontrada: $TASK"
              "$GITHUB_WORKSPACE/$GRADLE_CMD" "$TASK" --stacktrace --no-daemon
            else
              echo "assembleDebug não encontrada."
              echo "Tentando assemble..."
              "$GITHUB_WORKSPACE/$GRADLE_CMD" assemble --stacktrace --no-daemon
            fi

          fi

      - name: Procurar APK
        run: |
          echo "================================"
          echo "PROCURANDO APK"
          echo "================================"

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/app-debug.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Oloww-APK
          path: apk-final/app-debug.apk
          if-no-files-found: error
