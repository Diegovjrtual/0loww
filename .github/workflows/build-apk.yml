name: Gerar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        run: |
          echo "Arquivos do projeto:"
          ls -la
          echo ""
          echo "Pastas:"
          find . -maxdepth 2 -type f | sort | head -100

      - name: Ver tarefas Gradle
        run: gradle tasks

      - name: Gerar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          find . -name "*.apk" -type f -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Oloww-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
