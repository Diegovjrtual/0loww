name: 0low APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar estrutura Android
        run: |
          mkdir -p app/src/main/java/com/olow/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "0low"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.olow.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.olow.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val bom = platform("androidx.compose:compose-bom:2025.01.00")

              implementation(bom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/Theme.Olow"
                  android:label="0low"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Olow" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/olow/app/MainActivity.kt <<'EOF'
          package com.olow.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      var loggedIn by remember { mutableStateOf(false) }

                      if (!loggedIn) {
                          Column(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .padding(24.dp),
                              verticalArrangement = Arrangement.Center
                          ) {
                              Text(
                                  "0low",
                                  style = MaterialTheme.typography.displayMedium
                              )

                              Spacer(Modifier.height(16.dp))

                              Text("0low Destiny")

                              Spacer(Modifier.height(24.dp))

                              Button(
                                  onClick = { loggedIn = true },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("Entrar")
                              }

                              Spacer(Modifier.height(8.dp))

                              OutlinedButton(
                                  onClick = { loggedIn = true },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("Entrar com Google")
                              }

                              Spacer(Modifier.height(8.dp))

                              OutlinedButton(
                                  onClick = { loggedIn = true },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("Entrar com e-mail")
                              }
                          }
                      } else {
                          Column(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .padding(24.dp)
                          ) {
                              Text(
                                  "0low Destiny",
                                  style = MaterialTheme.typography.headlineMedium
                              )

                              Spacer(Modifier.height(20.dp))

                              Button(onClick = {}) {
                                  Text("Criar servidor")
                              }

                              Button(onClick = {}) {
                                  Text("Mensagens")
                              }

                              Button(onClick = {}) {
                                  Text("Perfil")
                              }

                              Button(onClick = {}) {
                                  Text("Entrar em call")
                              }

                              Button(onClick = {}) {
                                  Text("0low Nitro")
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: 0low-apk
          path: app/build/outputs/apk/debug/app-debug.apk
